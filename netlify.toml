# ONEMA SAÚDE — PWA + API na Netlify (ambiente de homologação).
#  - PWA estático: web/dist
#  - API: Netlify Function em netlify/functions/api.mts (rota /api/*), banco Netlify DB (Postgres/Neon)
#  - Motor de ciclos PRIME: função agendada (a cada hora)
#  - Mídia privada: Netlify Blobs
# Variáveis (painel da Netlify → Site configuration → Environment variables): ver docs/IMPLANTACAO.md.

[build]
  command = "npm run build && npm run netlify:init"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]
  # Nunca empacotar banco local de desenvolvimento nem o PWA (servido pela CDN) na Function.
  included_files = ["!data/**", "!web/**"]

# SPA: acesso direto a qualquer rota (a função com path /api/* tem precedência)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
